<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل حسابات المسوقين</title>
    <!-- تضمين Tailwind CSS للتصميم المتجاوب والسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين خط Cairo من Google Fonts لتنسيق النصوص العربية بشكل احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen flex flex-col antialiased">

    <!-- شريط الرأس الاعلى -->
    <header class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-50 backdrop-blur-md bg-white/90">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="bg-emerald-600 text-white p-2 rounded-xl font-black shadow-md shadow-emerald-200 text-sm sm:text-base">DZ</div>
                <h1 class="text-sm sm:text-base font-black text-gray-900 tracking-tight">شبكة المسوقين المعتمدين</h1>
            </div>
            <div class="text-[11px] sm:text-xs font-bold text-gray-500 bg-gray-100 px-2.5 py-1.5 rounded-xl border border-gray-200/50">
                إجمالي المسوقين: <span id="resellersCount" class="text-emerald-600 font-black">0</span>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للموقع -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- حقل البحث السريع -->
        <div class="mb-6 max-w-md mx-auto sm:mx-0">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="بحث باسم المسوق أو رقم هاتفه..." class="w-full bg-white border border-gray-200 rounded-2xl px-4 py-3 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 shadow-sm font-bold transition text-right">
            </div>
        </div>

        <!-- حالة التحميل المبدئي للبيانات -->
        <div id="loadingState" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-3"></div>
            <p class="text-gray-400 font-bold text-xs sm:text-sm">جاري جلب وترتيب المسوقين حسب الأكثر نشاطاً...</p>
        </div>

        <!-- رسالة تظهر في حال عدم وجود مسوقين -->
        <div id="noDataState" class="hidden text-center py-20 bg-white rounded-3xl border border-gray-100 p-6 shadow-sm max-w-md mx-auto text-gray-400 font-bold text-xs sm:text-sm">
            ❌ لا يوجد أي مسوق مسجل في المنصة حالياً أو لا يتطابق مع بحثك.
        </div>

        <!-- شبكة عرض كروت المسوقين -->
        <div id="resellersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 hidden">
            <!-- الكروت سيتم توليدها برمجياً هنا عبر JavaScript -->
        </div>

    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-white border-t border-gray-100 py-4 text-center text-[10px] sm:text-xs text-gray-400 font-bold mt-auto">
        دليل المسوقين المعتمدين لمشروع المتجر الإلكتروني &copy; 2026
    </footer>

    <!-- ربط الصفحة بقاعدة بيانات Firebase وجلب البيانات فورياً -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIfkBI0WhxZr1hCyiuYcbVYAy3wXAJxCU",
            authDomain: "walid-shop.firebaseapp.com",
            projectId: "walid-shop",
            storageBucket: "walid-shop.firebasestorage.app",
            messagingSenderId: "3705207162",
            appId: "1:3705207162:web:3a7cdfb831c0e3b09c3ec3",
            measurementId: "G-PGLFSTBVTH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allResellers = []; 

        async function loadResellersData() {
            const loadingState = document.getElementById('loadingState');
            const countSpan = document.getElementById('resellersCount');

            try {
                const q = query(collection(db, "users"), where("role", "==", "reseller"));
                const querySnapshot = await getDocs(q);
                
                allResellers = [];
                querySnapshot.forEach((doc) => {
                    allResellers.push({ id: doc.id, ...doc.data() });
                });

                // الترتيب الذكي: الأكثر تفعيلاً أولاً (current_activations تنازلياً)
                allResellers.sort((a, b) => {
                    const activeA = a.current_activations || 0;
                    const activeB = b.current_activations || 0;
                    
                    if (activeB !== activeA) {
                        return activeB - activeA;
                    }
                    return (b.max_activations || 0) - (a.max_activations || 0);
                });
                
                countSpan.textContent = allResellers.length;
                loadingState.classList.add('hidden');
                renderResellersCards(allResellers);

            } catch (error) {
                console.error("حدث خطأ أثناء تحميل بيانات المسوقين:", error);
                loadingState.innerHTML = `<p class="text-red-500 font-bold text-xs sm:text-sm">❌ فشل الاتصال بقاعدة البيانات. يرجى التحقق من الصلاحيات.</p>`;
            }
        }

        function renderResellersCards(list) {
            const resellersGrid = document.getElementById('resellersGrid');
            const noDataState = document.getElementById('noDataState');

            if (list.length === 0) {
                resellersGrid.classList.add('hidden');
                noDataState.classList.remove('hidden');
                return;
            }

            noDataState.classList.add('hidden');
            resellersGrid.classList.remove('hidden');
            resellersGrid.innerHTML = '';

            list.forEach(res => {
                const avatarUrl = res.avatar || 'https://placehold.co/150x150?text=👤';
                const name = res.name || 'مسوق بدون اسم';
                const phone = res.phone || '';
                
                const maxActivations = res.max_activations !== undefined ? res.max_activations : 0;
                const currentActivations = res.current_activations !== undefined ? res.current_activations : 0;
                
                const cleanPhone = phone.replace(/\D/g, ''); 

                resellersGrid.innerHTML += `
                    <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center text-center transition hover:shadow-md hover:border-gray-200/80 relative overflow-hidden group">
                        
                        <!-- تاغ النشاط / الترتيب المميز -->
                        <div class="absolute top-4 right-4 flex items-center gap-1 bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full text-[9px] font-black border border-emerald-100">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            نشط
                        </div>

                        <!-- الصورة الشخصية للمسوق -->
                        <div class="relative w-20 h-20 sm:w-22 sm:h-22 mb-3 mt-2">
                            <img src="${avatarUrl}" alt="${name}" class="w-full h-full rounded-full object-cover border-4 border-gray-50 shadow-inner group-hover:border-emerald-50 transition duration-300">
                        </div>
                        
                        <!-- إسم المسوق ورقم الهاتف -->
                        <h3 class="font-black text-gray-800 text-sm sm:text-base mb-0.5 line-clamp-1">${name}</h3>
                        <p class="text-[10px] sm:text-xs font-mono text-gray-400 font-bold mb-4" dir="ltr">${phone ? phone : 'رقم الهاتف غير محدد'}</p>
                        
                        <!-- صندوق الأرصدة والنشاطات -->
                        <div class="grid grid-cols-2 gap-2 w-full bg-slate-50 border border-slate-100 p-2.5 rounded-2xl mb-4 text-right">
                            <div class="flex flex-col justify-center border-l border-slate-200/60 pl-1">
                                <span class="text-[9px] font-bold text-gray-400 block mb-0.5">الرصيد الكلي</span>
                                <span class="text-xs font-black text-blue-600 font-mono">${maxActivations} <span class="text-[9px] text-gray-400 font-normal">حساب</span></span>
                            </div>
                            <div class="flex flex-col justify-center pr-2">
                                <span class="text-[9px] font-bold text-gray-400 block mb-0.5">تم تفعيلها</span>
                                <span class="text-xs font-black text-emerald-600 font-mono">${currentActivations} <span class="text-[9px] text-gray-400 font-normal">حساب</span></span>
                            </div>
                        </div>

                        <!-- زر التواصل الفوري عبر الواتساب (معدل للتحقق من الرصيد) -->
                        <div class="w-full mt-auto">
                            ${!cleanPhone ? `
                                <button disabled class="w-full bg-gray-50 text-gray-400 font-bold py-2.5 px-4 rounded-xl text-xs cursor-not-allowed border border-gray-100">
                                    🚫 لا يوجد رقم مسجل
                                </button>
                            ` : (currentActivations >= maxActivations) ? `
                                <button disabled class="w-full bg-red-50 text-red-400 border border-red-100 font-bold py-2.5 px-4 rounded-xl text-xs cursor-not-allowed flex items-center justify-center gap-1.5 shadow-sm">
                                    ⚠️ رصيد المسوق نفذ
                                </button>
                            ` : `
                                <a href="https://wa.me/${cleanPhone}?text=مرحباً، أريد تفعيل حسابي كتاجر على منصة SouqiExpress" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/10">
                                    💬 أطلب تفعيل حسابك
                                </a>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            const queryValue = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allResellers.filter(res => 
                (res.name && res.name.toLowerCase().includes(queryValue)) || 
                (res.phone && res.phone.includes(queryValue))
            );
            renderResellersCards(filtered);
        });

        loadResellersData();
    </script>
</body>
</html>
