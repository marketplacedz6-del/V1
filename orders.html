    /* أنماط حرجة مدمجة — خط دفاع أخير.
       إن تعذّر تحميل tailwind.css أو theme.css لأي سبب (شبكة، Service Worker،
       كاش تالف) تبقى الصفحة *مقروءة ومرتّبة* بدل أن تظهر نصاً ضخماً متراكباً.
       لا تحذف هذه الكتلة. */
    *{box-sizing:border-box}
*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;font-size:16px}
    body{margin:0;font-family:'Cairo','Tajawal','Noto Kufi Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
         font-size:15px;line-height:1.7;background:#f8fafc;color:#0f172a;
         overflow-wrap:break-word;word-break:normal}

    h1{font-size:1.6rem;line-height:1.35;margin:.6rem 0}
    h2{font-size:1.3rem;line-height:1.4;margin:.6rem 0}
    h3{font-size:1.1rem;line-height:1.45;margin:.5rem 0}
    p,li,td,th,span,div,label,a{font-size:inherit}
    button,input,select,textarea{font-family:inherit;font-size:1rem;max-width:100%}
    table{border-collapse:collapse;width:100%}
    [hidden],.hidden{display:none !important}

    <title>الطلبات الواردة | مركز التاجر</title>
    <link rel="stylesheet" href="assets/css/tailwind.css?v=41">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/theme.css?v=41">
    <style>body{font-family:'Cairo',sans-serif}</style>
    <style id="se-kill-offline">#se-offline-bar,#se-offline-bar.show{display:none!important;visibility:hidden!important;opacity:0!important;height:0!important;pointer-events:none!important}</style>

<body class="se-admin flex h-screen overflow-hidden">

    <div id="shell"></div>

    <div class="flex-grow flex flex-col min-w-0 overflow-hidden">
        <div id="shell-topbar"></div>

        <main class="flex-grow overflow-y-auto p-4 md:p-6 space-y-4">

            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                <div>
                    <h2 class="text-xl md:text-2xl font-black tracking-tight">🛒 الطلبات الواردة</h2>
                    <p class="se-muted text-xs font-bold mt-1">أكّد طلباتك بسرعة — المخزون يُحدَّث تلقائياً.</p>
                </div>
                <div class="flex gap-2 flex-wrap">
                    <select id="courierCsvTpl" class="se-input !py-2 !text-[11px] cursor-pointer w-auto">
                        <option value="generic">📄 صيغة عامة</option>
                        <option value="yalidine">📄 صيغة Yalidine</option>
                    </select>
                    <button onclick="exportCourierCsv()" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px]">🚚 تصدير لشركة التوصيل</button>
                    <button onclick="exportCsv()" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px]">⬇️ تصدير CSV</button>
                    <button onclick="exportToSheets()" id="sheetsBtn" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px] hidden" style="color:#0f9d58">📊 تصدير إلى Google Sheets</button>
                    <button onclick="openOrderModal()" class="se-btn se-btn-primary !px-3 !py-2 !text-[11px]">➕ طلب يدوي</button>
                </div>
            </div>

            <div id="courierBar" class="hidden se-card p-3 flex items-center justify-between gap-2 flex-wrap">
                <div class="text-[11px] font-black flex items-center gap-2">
                    <span class="se-badge se-badge-green">🚚 مربوط</span>
                    <span id="courierName">—</span>
                </div>
                <button onclick="shipAllPending()" id="shipAllBtn" class="se-btn se-btn-primary !px-3 !py-2 !text-[11px]">📦 إرسال كل الطلبات المؤكدة</button>
            </div>

            <!-- الإحصائيات (قابلة للنقر كفلاتر) -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <button onclick="setFilter('all')" id="f-all" class="se-card p-4 text-right transition">
                    <p class="text-[11px] font-extrabold se-muted">كل الطلبات</p>
                    <h3 id="stats-total" class="text-xl font-black mt-1">0</h3>
                </button>
                <button onclick="setFilter('pending')" id="f-pending" class="se-card p-4 text-right transition">
                    <p class="text-[11px] font-extrabold se-muted">⏳ قيد الانتظار</p>
                    <h3 id="stats-pending" class="text-xl font-black mt-1 text-amber-600">0</h3>
                </button>
                <button onclick="setFilter('completed')" id="f-completed" class="se-card p-4 text-right transition">
                    <p class="text-[11px] font-extrabold se-muted">✅ مكتملة</p>
                    <h3 id="stats-completed" class="text-xl font-black mt-1 text-emerald-600">0</h3>
                </button>
                <button onclick="setFilter('cancelled')" id="f-cancelled" class="se-card p-4 text-right transition">
                    <p class="text-[11px] font-extrabold se-muted">❌ ملغاة</p>
                    <h3 id="stats-cancelled" class="text-xl font-black mt-1 text-rose-600">0</h3>
                </button>
            </div>

            <!-- البحث -->
            <div class="se-card p-3 flex flex-col sm:flex-row gap-2">
                <div class="relative flex-1">
                    <input id="searchInput" oninput="applyView()" placeholder="ابحث بالاسم، الهاتف، المنتج أو رقم الطلب..." class="se-input !pr-10">
                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 se-muted text-sm"><i class="fa-solid fa-magnifying-glass"></i></span>
                </div>
                <select id="sortSelect" onchange="applyView()" class="se-input sm:w-44 !py-2.5 cursor-pointer">
                    <option value="new">🆕 الأحدث أولاً</option>
                    <option value="old">📜 الأقدم أولاً</option>
                    <option value="high">💰 الأعلى قيمة</option>
                </select>
            </div>

            <!-- قائمة الطلبات -->
            <div id="ordersList" class="space-y-3"></div>
            <div id="emptyState" class="se-card p-10 text-center hidden">
                <div class="text-5xl mb-3">📭</div>
                <p class="font-black text-sm">لا توجد طلبات مطابقة</p>
                <p class="se-muted text-xs font-bold mt-1">جرّب تغيير الفلتر أو كلمة البحث.</p>
            </div>
        </main>
    </div>

    <!-- نافذة الطلب اليدوي -->
    <div id="orderModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="se-card w-full max-w-lg max-h-[90vh] flex flex-col">
            <div class="p-5 border-b flex items-center justify-between" style="border-color:var(--se-border)">
                <h3 class="font-black text-sm">➕ إضافة طلب يدوي</h3>
                <button onclick="closeOrderModal()" class="se-muted hover:text-rose-500 text-lg">✕</button>
            </div>
            <form id="newOrderForm" onsubmit="sendOrder(event)" class="p-5 space-y-3 overflow-y-auto">
                <input id="form_customer_name" required placeholder="اسم الزبون *" class="se-input">
                <input id="form_phone_number" required inputmode="numeric" maxlength="10" dir="ltr" placeholder="رقم الهاتف * 06XXXXXXXX" class="se-input text-right">
                <select id="form_wilaya" class="se-input cursor-pointer"></select>
                <input id="form_address" required placeholder="العنوان الكامل *" class="se-input">
                <select id="form_product_ordered" required class="se-input cursor-pointer"><option value="">اختر المنتج *</option></select>
                <div class="grid grid-cols-3 gap-2">
                    <input id="form_quantity" type="number" min="1" value="1" required placeholder="الكمية" class="se-input">
                    <input id="form_selected_color" placeholder="اللون" class="se-input">
                    <input id="form_selected_size" placeholder="المقاس" class="se-input">
                </div>
                <button type="submit" id="saveOrderBtn" class="se-btn se-btn-primary w-full !py-3.5">💾 حفظ الطلب</button>
            </form>
        </div>
    </div>

    <script src="assets/js/config.js?v=41"></script>
    <script src="assets/js/app.js?v=41"></script>
    <script src="assets/js/subscription.js?v=41"></script>
    <script src="assets/js/merchant-shell.js?v=41"></script>
    <script src="assets/js/integrations.js?v=41"></script>
    <script src="assets/js/couriers.js?v=41"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp(window.SE_CONFIG.firebase);
        const db = getFirestore(app);
        const auth = getAuth(app);

        SHELL.mount('orders', 'الطلبات الواردة');

        let currentMerchant = null;
        let allOrders = [], productsMap = {}, shippingRates = [];
        let courierCfg = {};
        let sheetWebhook = '';
        let filter = 'all', unsub = null;

        const esc = SE.escape;
        const money = n => (Number(n) || 0).toLocaleString('en-US') + ' د.ج';

        window.toggleSidebar = function () {
            document.getElementById('sidebar').classList.toggle('translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        };
        window.logout = async function () { try { await signOut(auth); } catch (e) {} location.replace('login.html'); };

        function setStatus(ok, txt) { SHELL.setStatus(ok, txt); }

        /* التاريخ: يدعم created_at (الجديد) و created (القديم) */
        function orderDate(o) {
            const raw = o.created_at || o.created || null;
            if (!raw) return null;
            if (raw.toDate) return raw.toDate();
            const d = new Date(raw);
            return isNaN(d) ? null : d;
        }
        /* قيمة الطلب: نعتمد المحفوظ، ونحسب للطلبات القديمة */
        function orderTotals(o) {
            const qty = Number(o.quantity) || 1;
            const unit = o.unit_price != null ? Number(o.unit_price) : Number((productsMap[o.product_ordered] || {}).price || 0);
            const sub = unit * qty;
            let ship = o.shipping_price != null ? Number(o.shipping_price) : shipFromAddress(o.address);
            const total = o.total_price != null ? (Number(o.total_price) + ship) : (sub + ship);
            return { qty, unit, sub, ship, total };
        }
        function shipFromAddress(addr) {
            if (!addr) return 0;
            const clean = s => String(s || '').replace(/ولاية/g, '').trim();
            const r = shippingRates.find(x => String(addr).includes(clean(x.wilaya_name)));
            if (!r) return 0;
            if (/المكتب|desk/.test(addr)) return Number(r.desk_price) || 0;
            return Number(r.home_price) || 0;
        }
        function wilayaOf(o) {
            if (o.wilaya) return o.wilaya;
            const m = String(o.address || '').match(/ولاية:\s*([^|]+)/);
            return m ? m[1].trim() : '';
        }

        /* ============ المصادقة ============ */
        onAuthStateChanged(auth, async (user) => {
            if (!user) { location.replace('login.html'); return; }
            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (!snap.exists()) { await signOut(auth); location.replace('login.html'); return; }
                const d = snap.data();
                if (d.role !== 'merchant' && d.role !== 'admin') { alert('لا تملك صلاحية الدخول.'); location.replace('index.html'); return; }
                if (d.role === 'merchant' && d.is_approved !== true) {
                    if (window.SE_SUB) { window.SE_SUB.redirectExpired(d); return; }
                    alert('حسابك قيد المراجعة.'); await signOut(auth); location.replace('login.html'); return;
                }
                // ---- فحص الاشتراك الشهري (موحّد) ----
                if (d.role === 'merchant' && window.SE_SUB && !window.SE_SUB.status(d).active) {
                    window.SE_SUB.redirectExpired(d);
                    return;
                }
                if (d.role === 'merchant' && window.SE_SUB) { try { window.SE_SUB.mountBanner(d); } catch (e) {} }


                currentMerchant = { id: user.uid, ...d };
                const nm = d.name || 'متجر';
                SHELL.setStoreName(nm, currentMerchant ? currentMerchant.id : (currentUser ? currentUser.uid : ''));
                                fillWilayas();
                await loadRefs();
                initRealtime();
            } catch (e) { console.error(e); setStatus(false, 'خطأ في الاتصال ❌'); }
        });

        function fillWilayas() {
            document.getElementById('form_wilaya').innerHTML =
                '<option value="">-- الولاية (اختياري) --</option>' +
                (window.SE_WILAYAS || []).map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
        }

        async function loadRefs() {
            const mid = currentMerchant.id;
            const [prodSnap, shipSnap] = await Promise.all([
                getDocs(query(collection(db, "products"), where("user_id", "==", mid))),
                getDocs(query(collection(db, "shipping_rates"), where("merchant", "==", mid)))
            ]);
            productsMap = {};
            const opts = ['<option value="">اختر المنتج *</option>'];
            prodSnap.forEach(d => {
                const p = { id: d.id, ...d.data() };
                productsMap[d.id] = p;
                opts.push(`<option value="${esc(p.id)}">${esc(p.name)} — ${money(p.price)}</option>`);
            });
            document.getElementById('form_product_ordered').innerHTML = opts.join('');
            shippingRates = shipSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            // إعدادات التاجر: شركة التوصيل + رابط Google Sheets
            try {
                const st = await getDoc(doc(db, 'merchant_settings', mid));
                const data = st.exists() ? (st.data() || {}) : {};
                courierCfg = data.courier || {};
                sheetWebhook = data.sheet_webhook || '';
            } catch (e) { console.warn('merchant settings', e); }

            // أظهر زر «تصدير إلى Google Sheets» فقط إن كان الربط مضبوطاً
            const sheetBtn = document.getElementById('sheetsBtn');
            if (sheetBtn) sheetBtn.classList.toggle('hidden', !SEI.isSheetUrl(sheetWebhook));
            const linked = !!(courierCfg && courierCfg.courier);
            const bar = document.getElementById('courierBar');
            if (bar) {
                bar.classList.toggle('hidden', !linked);
                if (linked) document.getElementById('courierName').textContent = SEC.COURIERS[courierCfg.courier].name;
            }
        }

        /* ============ الاستماع اللحظي (بلا إعادة جلب كامل) ============ */
        function initRealtime() {
            if (unsub) unsub();
            const q = query(collection(db, "orders"), where("merchant", "==", currentMerchant.id));
            unsub = onSnapshot(q, (snap) => {
                allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                setStatus(true, `متصل — ${allOrders.length} طلب`);
                applyView();
            }, (err) => {
                console.error(err);
                setStatus(false, 'تعذّر جلب الطلبات ❌');
            });
        }

        window.setFilter = function (f) {
            filter = f;
            ['all', 'pending', 'completed', 'cancelled'].forEach(k => {
                const el = document.getElementById('f-' + k);
                if (el) el.style.outline = (k === f) ? '2px solid var(--se-primary)' : 'none';
            });
            applyView();
        };

        window.applyView = function () {
            // الإحصائيات دائماً على كل الطلبات
            const st = { pending: 0, completed: 0, cancelled: 0 };
            allOrders.forEach(o => { const s = normStatus(o.status); if (st[s] !== undefined) st[s]++; });
            document.getElementById('stats-total').textContent = allOrders.length;
            document.getElementById('stats-pending').textContent = st.pending;
            document.getElementById('stats-completed').textContent = st.completed;
            document.getElementById('stats-cancelled').textContent = st.cancelled;

            const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const sort = document.getElementById('sortSelect').value;

            let list = allOrders.filter(o => {
                if (filter !== 'all' && normStatus(o.status) !== filter) return false;
                if (!q) return true;
                const hay = [o.customer_name, o.phone_number, o.product_name, o.order_ref, o.id, wilayaOf(o)]
                    .map(x => String(x || '').toLowerCase()).join(' ');
                return hay.includes(q);
            });

            if (sort === 'high') list.sort((a, b) => orderTotals(b).total - orderTotals(a).total);
            else if (sort === 'old') list.sort((a, b) => (orderDate(a) || 0) - (orderDate(b) || 0));
            else list.sort((a, b) => (orderDate(b) || 0) - (orderDate(a) || 0));

            renderList(list);
        };

        function normStatus(s) {
            s = s || 'pending';
            return s === 'cancel' ? 'cancelled' : s;
        }

        function renderList(list) {
            const box = document.getElementById('ordersList');
            document.getElementById('emptyState').classList.toggle('hidden', list.length > 0);
            box.innerHTML = list.map(o => {
                const s = normStatus(o.status);
                const t = orderTotals(o);
                const d = orderDate(o);
                const name = productsMap[o.product_ordered] ? productsMap[o.product_ordered].name : (o.product_name || 'منتج محذوف');
                const ref = o.order_ref || ('#' + o.id.substring(0, 6).toUpperCase());
                const badge = s === 'completed' ? '<span class="se-badge se-badge-green">✅ مكتمل</span>'
                    : s === 'cancelled' ? '<span class="se-badge se-badge-red">❌ ملغى</span>'
                    : '<span class="se-badge" style="background:rgba(245,158,11,.15);color:#b45309">⏳ قيد الانتظار</span>';
                const opts = [];
                if (o.selected_color && !['غير محدد', 'قياسي', ''].includes(o.selected_color)) opts.push('اللون: ' + esc(o.selected_color));
                if (o.selected_size && !['غير محدد', 'قياسي', ''].includes(o.selected_size)) opts.push('المقاس: ' + esc(o.selected_size));

                return `
                <div class="se-card p-4 space-y-3">
                    <div class="flex items-start justify-between gap-2 flex-wrap">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-black text-sm truncate">${esc(o.customer_name || 'زبون')}</span>
                                ${badge}
                            </div>
                            <div class="text-[11px] se-muted font-bold mt-1">${esc(ref)} • ${d ? d.toLocaleDateString('ar-DZ') + ' ' + d.toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit' }) : 'بلا تاريخ'}</div>
                        </div>
                        <div class="text-left flex-shrink-0">
                            <div class="font-black text-base text-emerald-600">${money(t.total)}</div>
                            <div class="text-[10px] se-muted font-bold">منتج ${money(t.sub)} + شحن ${money(t.ship)}</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px] font-bold">
                        <div class="se-surface rounded-xl p-2.5 border" style="border-color:var(--se-border)">
                            🛍️ <span class="se-muted">المنتج:</span> ${esc(name)} × ${t.qty}
                            ${opts.length ? `<div class="se-muted mt-1">${opts.join(' • ')}</div>` : ''}
                        </div>
                        <div class="se-surface rounded-xl p-2.5 border" style="border-color:var(--se-border)">
                            📍 <span class="se-muted">${esc(wilayaOf(o) || 'بلا ولاية')}</span>
                            <div class="se-muted mt-1 break-words">${esc(o.address || 'بلا عنوان')}</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 flex-wrap">
                        <a href="tel:${esc(o.phone_number || '')}" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px]">📞 ${esc(o.phone_number || '—')}</a>
                        <a href="https://wa.me/213${String(o.phone_number || '').replace(/^0/, '')}" target="_blank" rel="noopener" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px] text-emerald-600">💬 واتساب</a>
                        ${s !== 'completed' ? `<button onclick="updateStatus('${o.id}','completed')" class="se-btn se-btn-accent !px-3 !py-2 !text-[11px]">✅ تأكيد</button>` : ''}
                        ${s !== 'cancelled' ? `<button onclick="updateStatus('${o.id}','cancelled')" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px] text-rose-500">❌ إلغاء</button>` : ''}
                        ${s !== 'pending' ? `<button onclick="updateStatus('${o.id}','pending')" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px]">↩️ إرجاع</button>` : ''}
                        ${o.tracking_number
                            ? `<button onclick="trackParcel('${o.id}')" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px] text-sky-600">📍 ${esc(o.tracking_number)}</button>`
                            : (courierCfg && courierCfg.courier && s === 'completed'
                                ? `<button onclick="shipOrder('${o.id}')" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px] text-indigo-600">🚚 إرسال للشحن</button>`
                                : '')}
                        <button onclick="deleteOrder('${o.id}')" class="se-btn se-btn-ghost !px-3 !py-2 !text-[11px] text-rose-400 mr-auto">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        /* ============ تحديث الحالة + مزامنة المخزون ============ */
        window.updateStatus = async function (id, newStatus) {
            const labels = { completed: 'تأكيد', cancelled: 'إلغاء', pending: 'إرجاع لقيد الانتظار' };
            const target = allOrders.find(x => x.id === id);

            // تنبيه: الطلب أُرسل لشركة التوصيل — تغيير الحالة هنا لا يوقف الطرد
            if (target && target.tracking_number && newStatus !== 'completed') {
                if (!confirm(
                    `⚠️ هذا الطلب أُرسل مسبقاً لشركة التوصيل (${target.tracking_number}).\n\n` +
                    `تغيير الحالة هنا لا يُلغي الطرد لدى الشركة — يجب إلغاؤه من لوحتها مباشرة.\n\n` +
                    `هل تريد المتابعة على أي حال؟`)) return;
            } else if (!confirm(`هل تريد ${labels[newStatus]} هذا الطلب؟`)) return;
            try {
                const ref = doc(db, "orders", id);
                const snap = await getDoc(ref);
                if (!snap.exists()) return SE.toast('الطلب غير موجود', 'error');
                const o = snap.data();
                const oldStatus = normStatus(o.status);
                if (oldStatus === newStatus) return;

                // مزامنة المخزون: خصم عند التأكيد، إرجاع عند التراجع
                if (o.product_ordered) {
                    const pRef = doc(db, "products", o.product_ordered);
                    const pSnap = await getDoc(pRef);
                    if (pSnap.exists()) {
                        const stock = Number(pSnap.data().stock) || 0;
                        const qty = Number(o.quantity) || 1;
                        if (newStatus === 'completed' && oldStatus !== 'completed') {
                            await updateDoc(pRef, { stock: Math.max(0, stock - qty) });
                        } else if (oldStatus === 'completed' && newStatus !== 'completed') {
                            await updateDoc(pRef, { stock: stock + qty });
                        }
                    }
                }
                await updateDoc(ref, { status: newStatus });
                const local = allOrders.find(x => x.id === id);
                if (local) local.status = newStatus;
                await loadRefs();
                SE.toast(`✅ تم ${labels[newStatus]}`, 'success');

                // إرسال تلقائي لشركة التوصيل عند التأكيد (إن كان مفعّلاً)
                if (newStatus === 'completed' && courierCfg && courierCfg.courier && courierCfg.autoShip && !o.tracking_number) {
                    const sent = await window.shipOrder(id, true);
                    if (sent) SE.toast('🚚 تم إرسال الطلب تلقائياً لشركة التوصيل', 'success', 3500);
                }
            } catch (e) {
                console.error(e);
                SE.toast('❌ تعذّر تحديث الطلب', 'error');
            }
        };

        window.deleteOrder = async function (id) {
            if (!confirm("حذف هذا الطلب نهائياً؟")) return;
            try { await deleteDoc(doc(db, "orders", id)); SE.toast('🗑️ تم الحذف', 'info'); }
            catch (e) { console.error(e); SE.toast('❌ تعذّر الحذف', 'error'); }
        };

        /* ============ الطلب اليدوي ============ */
        window.openOrderModal = function () {
            const m = document.getElementById('orderModal');
            m.classList.remove('hidden'); m.classList.add('flex');
        };
        window.closeOrderModal = function () {
            const m = document.getElementById('orderModal');
            m.classList.add('hidden'); m.classList.remove('flex');
        };

        window.sendOrder = async function (e) {
            e.preventDefault();
            const phone = document.getElementById('form_phone_number').value.trim();
            if (!/^0[5-7][0-9]{8}$/.test(phone)) return SE.toast('⚠️ رقم هاتف غير صحيح (مثال 0551234567)', 'error');

            const pid = document.getElementById('form_product_ordered').value;
            const product = productsMap[pid];
            if (!product) return SE.toast('⚠️ اختر منتجاً صالحاً', 'error');

            const qty = parseInt(document.getElementById('form_quantity').value, 10) || 1;
            const wilaya = document.getElementById('form_wilaya').value;
            const unit = Number(product.price) || 0;
            const clean = s => String(s || '').replace(/ولاية/g, '').trim();
            const rate = shippingRates.find(r => clean(r.wilaya_name) === clean(wilaya));
            const ship = rate ? (Number(rate.home_price) || 0) : 0;

            const btn = document.getElementById('saveOrderBtn');
            btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...';
            try {
                await addDoc(collection(db, "orders"), {
                    order_ref: 'SE-' + Date.now().toString().slice(-8),
                    customer_name: document.getElementById('form_customer_name').value.trim(),
                    phone_number: phone,
                    address: document.getElementById('form_address').value.trim(),
                    wilaya: wilaya,
                    product_ordered: pid,
                    product_name: product.name || '',
                    quantity: qty,
                    unit_price: unit,
                    total_price: unit * qty,
                    shipping_price: ship,
                    selected_color: document.getElementById('form_selected_color').value.trim() || 'غير محدد',
                    selected_size: document.getElementById('form_selected_size').value.trim() || 'غير محدد',
                    status: 'pending',
                    merchant: currentMerchant.id,
                    user_id: currentMerchant.id,
                    created_at: serverTimestamp()
                });
                closeOrderModal();
                document.getElementById('newOrderForm').reset();
                fillWilayas();
                SE.toast('✅ تم إضافة الطلب', 'success');
            } catch (err) {
                console.error(err);
                SE.toast('❌ تعذّر حفظ الطلب', 'error');
            } finally {
                btn.disabled = false; btn.textContent = '💾 حفظ الطلب';
            }
        };

        /* ============ الشحن عبر شركة التوصيل ============ */
        window.shipOrder = async function (id, silent) {
            const o = allOrders.find(x => x.id === id);
            if (!o) return;
            if (!courierCfg || !courierCfg.courier) { SE.toast('اربط شركة توصيل من صفحة الشحن أولاً', 'error'); return false; }
            if (o.tracking_number) { if (!silent) SE.toast('هذا الطلب مُرسَل مسبقاً', 'info'); return false; }

            // لا تُشحن إلا الطلبات المؤكَّدة — الملغى أو المعلّق قد يُكلّف التاجر شحناً بلا مقابل
            const st = normStatus(o.status);
            if (st !== 'completed') {
                if (!silent) SE.toast(
                    st === 'cancelled'
                        ? '❌ لا يمكن شحن طلب ملغى'
                        : '⚠️ أكّد الطلب أولاً قبل إرساله لشركة التوصيل',
                    'error', 3500);
                return false;
            }

            // تحقّق مؤكَّد من الخادم لمنع الإرسال المزدوج
            try {
                const fresh = await getDoc(doc(db, 'orders', id));
                if (fresh.exists() && (fresh.data() || {}).tracking_number) {
                    o.tracking_number = fresh.data().tracking_number;
                    if (!silent) SE.toast('هذا الطلب مُرسَل مسبقاً', 'info');
                    return false;
                }
            } catch (e) { console.warn(e); }

            if (!silent && !confirm(`إرسال الطلب إلى ${SEC.COURIERS[courierCfg.courier].name}؟`)) return false;

            const r = await SEC.createParcel(courierCfg, o);
            if (r.ok && r.tracking) {
                o.tracking_number = r.tracking;
                try {
                    await updateDoc(doc(db, 'orders', id), {
                        tracking_number: r.tracking,
                        courier: courierCfg.courier,
                        shipped_at: serverTimestamp()
                    });
                } catch (e) { console.error(e); }
                if (!silent) SE.toast('✅ تم الإرسال — رقم التتبّع: ' + r.tracking, 'success', 4000);
                return true;
            }
            if (!silent) {
                SE.toast('❌ ' + (r.error || 'تعذّر الإرسال') + (r.network ? ' — جرّب التصدير CSV' : ''), 'error', 5000);
            }
            return false;
        };

        window.shipAllPending = async function () {
            const list = allOrders.filter(o => normStatus(o.status) === 'completed' && !o.tracking_number);
            if (!list.length) return SE.toast('لا توجد طلبات مؤكدة بانتظار الشحن', 'info');
            if (!confirm(`إرسال ${list.length} طلب إلى شركة التوصيل؟`)) return;
            const btn = document.getElementById('shipAllBtn');
            btn.disabled = true;
            let ok = 0, fail = 0;
            for (let i = 0; i < list.length; i++) {
                btn.textContent = `⏳ ${i + 1}/${list.length}...`;
                const done = await window.shipOrder(list[i].id, true);
                done ? ok++ : fail++;
            }
            btn.disabled = false; btn.textContent = '📦 إرسال كل الطلبات المؤكدة';
            SE.toast(`تم إرسال ${ok} طلب${fail ? ` — فشل ${fail}` : ''}`, ok ? 'success' : 'error', 4000);
        };

        window.trackParcel = async function (id) {
            const o = allOrders.find(x => x.id === id);
            if (!o || !o.tracking_number) return;
            SE.toast('⏳ جاري جلب حالة الشحنة...', 'info', 1500);
            const r = await SEC.track(courierCfg, o.tracking_number);
            if (r.ok) {
                const st = r.data && (r.data.status || (r.data.events && r.data.events[0] && r.data.events[0].status));
                SE.toast('📍 ' + o.tracking_number + ' — ' + SEC.statusAr(st), 'success', 5000);
            } else {
                SE.toast('تعذّر التتبّع: ' + (r.error || ''), 'error', 4000);
            }
        };

        /* ============ تصدير كل الطلبات إلى Google Sheets ============ */
        window.exportToSheets = async function () {
            if (!SEI.isSheetUrl(sheetWebhook)) {
                return SE.toast('⚠️ اضبط رابط Google Sheets من الإعدادات أولاً', 'error', 4000);
            }
            const shown = getVisibleOrders();
            if (!shown.length) return SE.toast('لا توجد طلبات للتصدير', 'error');

            const scope = (filter === 'all' && !document.getElementById('searchInput').value.trim())
                ? 'كل الطلبات' : 'الطلبات المعروضة حالياً';
            if (!confirm(`تصدير ${shown.length} طلب (${scope}) إلى جدول Google Sheets؟\n\nلن تتكرر الطلبات المُصدَّرة سابقاً.`)) return;

            const btn = document.getElementById('sheetsBtn');
            btn.disabled = true;
            let ok = 0, fail = 0;

            for (let i = 0; i < shown.length; i++) {
                btn.textContent = `⏳ ${i + 1}/${shown.length}...`;
                const sent = await SEI.sendToSheet(sheetWebhook, buildSheetRow(shown[i]));
                sent ? ok++ : fail++;
                if (i < shown.length - 1) await new Promise(r => setTimeout(r, 250));
            }

            btn.disabled = false;
            btn.textContent = '📊 تصدير إلى Google Sheets';
            SE.toast(
                fail ? `📊 أُرسل ${ok} طلب — تعذّر ${fail}` : `📊 تم تصدير ${ok} طلب إلى جدولك بنجاح`,
                fail ? 'error' : 'success', 5000
            );
        };

        /* بناء صف الجدول بالترتيب المعتمد.
           نستخرج القيم من الحقول الجديدة، ومع الطلبات القديمة نستنتجها من العنوان. */
        function buildSheetRow(o) {
            const t = orderTotals(o);
            const d = orderDate(o);
            const addr = String(o.address || '');
            const pick = (re) => { const m = addr.match(re); return m ? m[1].trim() : ''; };

            const commune = o.commune || pick(/بلدية:\s*([^|]+)/);
            const addressLine = o.address_line || pick(/العنوان الكامل:\s*([^|]+)/) ||
                addr.replace(/(ولاية|بلدية|التوصيل|العنوان الكامل):\s*[^|]*\|?/g, '')   // احذف الحقول المدمجة
                    .replace(/(توصيل للمنزل|استلام من المكتب)\s*\|?/g, '')              // واحذف نوع التوصيل
                    .replace(/^\s*\|\s*|\s*\|\s*$/g, '')
                    .replace(/\s+/g, ' ').trim() || addr;

            const isDesk = o.delivery_type === 'desk' || /المكتب|stopdesk|desk/i.test(addr);
            const prod = productsMap[o.product_ordered] || {};
            const statusAr = { pending: 'قيد الانتظار', completed: 'مؤكّد', cancelled: 'ملغى' };

            return {
                order_id:        o.order_ref || o.id,
                order_date:      d ? d.toLocaleDateString('en-CA') : '',
                customer_name:   o.customer_name || '',
                phone_1:         o.phone_number || '',
                phone_2:         o.phone_2 || '',
                wilaya:          wilayaOf(o),
                commune:         commune,
                delivery_type:   isDesk ? 'مكتب' : 'منزل',
                address:         addressLine,
                product_sku:     o.product_sku || prod.sku || o.product_ordered || '',
                product_name:    prod.name || o.product_name || '',
                quantity:        t.qty,
                unit_price:      t.unit,
                total_amount:    t.total,
                confirmation:    statusAr[normStatus(o.status)] || normStatus(o.status),
                notes:           [o.note, o.selected_color && o.selected_color !== 'غير محدد' ? 'اللون: ' + o.selected_color : '',
                                  o.selected_size && o.selected_size !== 'غير محدد' ? 'المقاس: ' + o.selected_size : '',
                                  o.tracking_number ? 'تتبّع: ' + o.tracking_number : '']
                                 .filter(Boolean).join(' • ')
            };
        }

        // الطلبات المعروضة حالياً (نفس منطق العرض)
        function getVisibleOrders() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            return allOrders.filter(o => {
                if (filter !== 'all' && normStatus(o.status) !== filter) return false;
                if (!q) return true;
                const hay = [o.customer_name, o.phone_number, o.product_name, o.order_ref, o.id, wilayaOf(o)]
                    .map(x => String(x || '').toLowerCase()).join(' ');
                return hay.includes(q);
            });
        }

        window.exportCourierCsv = function () {
            const tpl = document.getElementById('courierCsvTpl').value;
            const list = allOrders.filter(o => normStatus(o.status) !== 'cancelled');
            if (!list.length) return SE.toast('لا توجد طلبات للتصدير', 'error');
            const n = SEC.exportCourierCsv(list, tpl);
            SE.toast(n ? `🚚 تم تصدير ${n} طلب — ارفع الملف في لوحة شركة التوصيل` : '❌ تعذّر التصدير', n ? 'success' : 'error', 4500);
        };

        /* ============ تصدير CSV ============ */
        window.exportCsv = function () {
            if (!allOrders.length) return SE.toast('لا توجد طلبات للتصدير', 'error');
            const head = ['رقم الطلب', 'التاريخ', 'الزبون', 'الهاتف', 'الولاية', 'العنوان', 'المنتج', 'الكمية', 'سعر الوحدة', 'الشحن', 'الإجمالي', 'الحالة'];
            const rows = allOrders.map(o => {
                const t = orderTotals(o), d = orderDate(o);
                const nm = productsMap[o.product_ordered] ? productsMap[o.product_ordered].name : (o.product_name || '');
                return [o.order_ref || o.id, d ? d.toLocaleDateString('en-CA') : '', o.customer_name || '', o.phone_number || '',
                    wilayaOf(o), String(o.address || '').replace(/[\n\r]+/g, ' '), nm, t.qty, t.unit, t.ship, t.total, normStatus(o.status)];
            });
            const csv = [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `orders-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click(); URL.revokeObjectURL(a.href);
            SE.toast('⬇️ تم تصدير ' + rows.length + ' طلب', 'success');
        };

        setFilter('all');
    </script>
</body>
</html>
